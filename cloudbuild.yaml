steps:
  # Step 1: Build Docker Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/aegis-ai:$COMMIT_SHA', '.']

  # Step 2: Push Image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/aegis-ai:$COMMIT_SHA']

  # Step 3: Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'aegis-ai'
      - '--image=gcr.io/$PROJECT_ID/aegis-ai:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production,AGORA_APP_ID=3e7c3afde1814bc8bc030558ef76e1a7,AGORA_APP_CERTIFICATE=10fec23c56ad40ceb25f3843ae79496d,AGORA_PIPELINE_ID=224c3a143ef64e1c8d6644babca5bb9c,GROQ_MODEL=openai/gpt-oss-20b'

images:
  - 'gcr.io/$PROJECT_ID/aegis-ai:$COMMIT_SHA'
